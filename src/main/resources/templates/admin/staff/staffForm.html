<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${staffForm.id == null ? 'Add Staff' : 'Edit Staff'}"></title>
    <link rel="stylesheet" th:href="@{/css/admin/staff/staff-form.css}">
</head>
<body>

<div class="page-container">
    <div class="form-card">

        <div class="form-header">
            <h1 th:text="${staffForm.id == null ? 'Add Staff Member' : 'Edit Staff Member'}"></h1>
            <p>Register a staff member and assign their department.</p>
        </div>

        <form th:action="${staffForm.id == null}
                ? @{/admin/staff}
                : @{/admin/staff/{id}(id=${staffForm.id})}"
              th:object="${staffForm}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div th:if="${#fields.hasGlobalErrors()}" class="server-error">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Enter full name" autocomplete="off">
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="Enter email" autocomplete="off">
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" th:field="*{phone}" placeholder="10-digit phone number" autocomplete="off">
                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <select id="department" th:field="*{departmentId}">
                    <option value="">Select Department</option>
                    <option th:each="department : ${departments}"
                            th:value="${department.id}"
                            th:text="${department.name}">
                    </option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                    <span th:if="${staffForm.id != null}" class="hint-text">(leave blank to keep unchanged)</span>
                </label>
                <input type="password" id="password" th:field="*{password}" placeholder="Enter password" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Re-enter password" autocomplete="new-password">
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/staff}" class="cancel-btn">Cancel</a>
                <button type="submit" class="submit-btn"
                        th:text="${staffForm.id == null ? 'Add Staff' : 'Update Staff'}"></button>
            </div>

        </form>
    </div>
</div>

</body>
</html>

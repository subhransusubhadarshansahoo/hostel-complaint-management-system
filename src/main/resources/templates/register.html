<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
</head>
<body>

<h2>Student Registration</h2>

<form
        th:action="@{/register}"
        th:object="${user}"
        method="post">

    <label>Name</label><br>
    <input type="text" th:field="*{name}" required><br><br>

    <label>Email</label><br>
    <input type="email" th:field="*{email}" required><br><br>

    <label>Phone Number</label><br>
    <input type="text" th:field="*{phoneNo}" required><br><br>

    <label>Password</label><br>
    <input type="password" th:field="*{password}" required><br><br>



    <label>confirm password</label><br>
    <input type="password" th:field="*{confirmPassword}"  required>
    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<br>

<a th:href="@{/login}">
    Already have an account? Login
</a>

</body>
</html>

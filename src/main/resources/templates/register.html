<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

<div class="auth-card">
    <header class="auth-header">
        <h2>Student Registration</h2>
        <p>Hostel Complaint Management System</p>
    </header>

    <form th:action="@{/register}" th:object="${user}" method="post">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" th:field="*{name}" placeholder="subhransu sahoo">
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" th:field="*{email}" placeholder="student@example.com">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label for="phoneNo">Phone Number</label>
            <input type="tel" id="phoneNo" th:field="*{phoneNo}" placeholder="10-digit number">
            <span class="field-error" th:if="${#fields.hasErrors('phoneNo')}" th:errors="*{phoneNo}"></span>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}">
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}">
                <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="hostelId">Hostel</label>
                <select id="hostelId" th:field="*{hostelId}">
                    <option value="">Select Hostel</option>
                    <option th:each="hostel : ${hostels}" th:value="${hostel.id}" th:text="${hostel.name}"></option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('hostelId')}" th:errors="*{hostelId}"></span>
            </div>

            <div class="form-group">
                <label for="roomNumber">Room No.</label>
                <input type="text" id="roomNumber" th:field="*{roomNumber}" placeholder="e.g. B-204">
                <span class="field-error" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}"></span>
            </div>
        </div>

        <button type="submit" class="btn-submit">Register</button>
    </form>

    <footer class="auth-footer">
        Already have an account? <a th:href="@{/login}">Login</a>
    </footer>
</div>

</body>
</html>
